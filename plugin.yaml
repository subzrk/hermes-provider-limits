name: provider-limits
version: 1.2.0
description: Live provider quotas and per-session usage for Hermes Desktop.
author: Jaime Marques
homepage: https://github.com/JaimeMarques/hermes-provider-limits
# The packaged Desktop half requires unified plugin discovery, ctx.os, and
# host.state.connectionId. The last of those lands in v2026.8.16.2, which ships
# hermes 0.20.3. The loader compares this against the distribution version, not
# the release-date tag.
requires_hermes: ">=0.20.3"
